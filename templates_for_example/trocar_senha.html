<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Senha</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/login_cadastro.css">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/img/assets/fav_icon.png">
    <style>
        #message {
            margin: 12px 0 18px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 40px;
            box-sizing: border-box;
            opacity: 0;
            transform: translateY(-6px);
            transition: opacity .18s ease, transform .18s ease, box-shadow .18s ease;
            pointer-events: none;
            visibility: hidden;
            border-left: 4px solid transparent;
            background: rgba(0, 0, 0, 0.03);
            color: #222 !important;
        }

        /* mostrar */
        #message.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
            visibility: visible;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
        }

        /* tipos */
        #message.error {
            background: #fff5f5;
            border-left-color: #e55353;
            color: #8a1f1f !important;
        }

        #message.success {
            background: #f6ffed;
            border-left-color: #34a853;
            color: #1e5326 !important;
        }

        #message.info {
            background: #eef7ff;
            border-left-color: #2b7cff;
            color: #08306b !important;
        }

        /* ícone via pseudo-elemento */
        #message::before {
            content: "";
            display: inline-block;
            width: 18px;
            height: 18px;
            flex: 0 0 18px;
            border-radius: 50%;
            text-align: center;
            line-height: 18px;
            font-size: 14px;
        }

        #message > span {
            line-height: 1;
        }

        /* responsividade */
        @media (max-width: 480px) {
            #message {
                font-size: 13px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="left"></div>
    <div class="right">
        <form action="/trocar_senha" method="POST">
            {% if erro %}
            <div class="error-card">{{erro}}</div>
            {% endif %}
            <h2>Recuperar Senha</h2>
            <p class="sub">Cria Nova senha</p>

            <label for="nova_senha">Nova Senha</label>
            <input type="password" id="nova_senha" name="nova_senha" placeholder="Digite sua nova senha" required>

            <label for="repetir_senha">Repetir Nova Senha</label>
            <input type="password" id="repetir_senha" name="repetir_senha" placeholder="Repita sua nova senha" required>

            <input type="hidden" name="csrf_token" value="{{ request.session.get('CSRF_token') }}">


            <div id="message"></div>

            <button type="submit" id="submit-btn" disabled>Trocar Senha</button>
        </form>
    </div>
</div>
<script src="/static/js/trocar_senha.js"></script>
</body>
</html>
