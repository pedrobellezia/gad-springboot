<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Configurações</title>
    <link rel="icon" type="image/png" sizes="16x16" href="/static/img/assets/fav_icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
          rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet"/>
    <link rel="stylesheet" href="/static/css/painel_gestor.css">
    <link rel="stylesheet" href="/static/css/sidebar.css">
    <link rel="stylesheet" href="/static/css/profile.css">
    <link rel="stylesheet" href="/static/css/responsividade.css">
    <link rel="stylesheet" href="/static/css/error_popup.css">
    <style>
        .settings-card {
            background-color: white;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            max-width: 600px;
            margin: 20px auto;
        }

        .settings-card h2 {
            margin-top: 0;
            margin-bottom: 24px;
            color: #111827;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 600;
            font-size: 0.875rem;
        }

        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #843af3;
            box-shadow: 0 0 0 3px rgba(132, 58, 243, 0.15);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            border: none;
            width: 100%;
        }

        .btn-primary {
            background-color: #843af3;
            color: white;
        }

        .btn-primary:hover {
            background-color: #6d28d9;
        }

        .mensagem {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            font-weight: 600;
            text-align: center;
        }

        .mensagem-sucesso {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .mensagem-erro {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>

<body>
    <div class="container">
        <aside class="sidebar expanded" id="sidebar">
            <div class="logo">
                <img src="/static/img/assets/logo_GAD_PAINEL.png" alt="Logo" style="width: 80%; height: auto;" />
            </div>
            <nav class="menu-wrapper">
                <div class="menu" id="menuContainer">
                    <!-- Menu gerado dinamicamente via JS -->
                </div>
                <div style="margin-top: auto; width: 100%;">
                    <a href="javascript:void(0);" id="logoutBtn" class="menu-item logout">
                        <span class="material-symbols-rounded">exit_to_app</span>
                        <span class="text">Sair</span>
                    </a>
                </div>
            </nav>
        </aside>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <main class="main-content">
            <header class="header">
                <button id="toggleBtn" class="toggle-btn">
                    <span class="material-symbols-rounded" id="iconToggle">chevron_left</span>
                </button>
                <h1>Configurações</h1>
                <div class="user-info">
                    <span id="headerUserName">Carregando...</span>
                    <img id="headerUserAvatar" src="/static/img/assets/logo_GAD_HOME.png" alt="Avatar" class="avatar">
                </div>
            </header>

            <div class="content-body">
                <div id="alertMessage" style="display: none;"></div>

                <div class="settings-card">
                    <h2>Alterar Senha</h2>
                    <form id="changePasswordForm">
                        <div class="form-group">
                            <label for="senha_atual">Senha Atual</label>
                            <input type="password" id="senha_atual" name="senha_atual" required>
                        </div>
                        <div class="form-group">
                            <label for="nova_senha">Nova Senha (mínimo 6 caracteres)</label>
                            <input type="password" id="nova_senha" name="nova_senha" required minlength="6">
                        </div>
                        <div class="form-group">
                            <label for="confirmar_nova_senha">Confirmar Nova Senha</label>
                            <input type="password" id="confirmar_nova_senha" name="confirmar_nova_senha" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Salvar Nova Senha</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/js/sidebar.js"></script>
    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/login';
        }

        function getAvatarUrl(avatar) {
            if (!avatar || avatar === 'None' || avatar === 'icon_padrao.png') {
                return '/static/img/assets/logo_GAD_HOME.png'; 
            }
            if (avatar.startsWith('http://') || avatar.startsWith('https://')) {
                return avatar;
            }
            return '/static/uploads/' + avatar;
        }

        let currentUser = null;
        async function loadSettings() {
            try {
                const resMe = await fetch('/me', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (!resMe.ok) {
                    localStorage.removeItem('token');
                    window.location.href = '/login';
                    return;
                }

                currentUser = await resMe.json();
                if (!currentUser) return;

                document.getElementById('headerUserName').textContent = currentUser.nome;
                document.getElementById('headerUserAvatar').src = getAvatarUrl(currentUser.avatar);

                // Configurar menu dinâmico conforme o papel
                const menuContainer = document.getElementById('menuContainer');
                if (currentUser.role === 'CLIENTE') {
                    menuContainer.innerHTML = `
                        <a href="/painel_cliente" class="menu-item"><span class="material-symbols-rounded">space_dashboard</span><span class="text">Postagens</span></a>
                        <a href="/cliente_convite" class="menu-item"><span class="material-symbols-rounded">forward_to_inbox</span><span class="text">Convites</span></a>
                        <a href="/perfil_cliente" class="menu-item"><span class="material-symbols-rounded">Person</span><span class="text">Perfil</span></a>
                        <a href="/config" class="menu-item active"><span class="material-symbols-rounded">settings</span><span class="text">Configurações</span></a>
                    `;
                } else if (currentUser.role === 'REDATOR') {
                    menuContainer.innerHTML = `
                        <a href="/painel_redator" class="menu-item"><span class="material-symbols-rounded">space_dashboard</span><span class="text">Postagens</span></a>
                        <a href="/redator_convite" class="menu-item"><span class="material-symbols-rounded">forward_to_inbox</span><span class="text">Convites</span></a>
                        <a href="/perfil_redator" class="menu-item"><span class="material-symbols-rounded">Person</span><span class="text">Perfil</span></a>
                        <a href="/config" class="menu-item active"><span class="material-symbols-rounded">settings</span><span class="text">Configurações</span></a>
                    `;
                }
            } catch (err) {
                console.error('Erro ao carregar configurações:', err);
            }
        }

        // Alterar Senha
        document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const novaSenha = document.getElementById('nova_senha').value;
            const confirmarNovaSenha = document.getElementById('confirmar_nova_senha').value;
            const alertMessage = document.getElementById('alertMessage');
            alertMessage.style.display = 'none';

            if (novaSenha !== confirmarNovaSenha) {
                showAlert('As senhas não coincidem.', 'erro');
                return;
            }

            try {
                const response = await fetch('/me', {
                    method: 'PUT',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        nome: currentUser.nome,
                        email: currentUser.email,
                        senha: novaSenha,
                        avatar: currentUser.avatar
                    })
                });

                if (response.ok) {
                    showAlert('Senha alterada com sucesso!', 'sucesso');
                    document.getElementById('changePasswordForm').reset();
                } else {
                    showAlert('Erro ao alterar senha. Tente novamente.', 'erro');
                }
            } catch (err) {
                console.error('Erro ao salvar senha:', err);
                showAlert('Erro de conexão com o servidor.', 'erro');
            }
        });

        function showAlert(message, type) {
            const alertMessage = document.getElementById('alertMessage');
            alertMessage.textContent = message;
            alertMessage.className = `mensagem mensagem-${type}`;
            alertMessage.style.display = 'block';
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/login';
        });

        loadSettings();
    </script>
</body>

</html>
