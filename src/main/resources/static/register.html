<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <link rel="icon" type="image/png" sizes="16x16" href="/static/img/assets/fav_icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="/static/css/login_cadastro.css">
</head>

<body>
<div class="container">
    <div class="left cadastro-bg">
        <div class="green-bar"></div>
        <div class="left-content">
            <h1>Transforme sua experiência</h1>
            <p>Simplifique sua rotina com uma plataforma moderna, feita para você.</p>
        </div>
    </div>
    <div class="right">
        <form id="registerForm">
            <div id="errorCard" class="error-card" style="display: none;"></div>
            <div id="successCard" class="success-card" style="display: none; background-color: #d4edda; color: #155724; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                Cadastro realizado com sucesso! Redirecionando para o login...
            </div>

            <h2>✨ Bem-vindo!<br>Crie sua conta para começar.</h2>
            <p class="sub">Insira seus dados e junte-se à nossa plataforma.</p>

            <label for="tipo_usuario">Você está se cadastrando como:</label>
            <select name="tipo_usuario" id="tipo_usuario" required>
                <option value="Cliente">Cliente</option>
                <option value="Redator">Redator</option>
            </select>

            <label for="email">Email</label>
            <input type="email" name="email" id="emailField" placeholder="Digite seu e-mail" required>

            <label for="nome">Nome</label>
            <input type="text" id="nomeField" name="nome" placeholder="Digite seu nome completo" required>

            <label for="senha">Senha</label>
            <input type="password" id="senhaField" name="senha" placeholder="Digite sua senha" required>
            
            <div id="campos_gestor" style="display: none;">
                <!-- O código de convite agora é gerado automaticamente -->
            </div>

            <button type="submit">Criar conta</button>
            
            <div class="link" style="margin-top: 15px; text-align: center;">
                <p>Já tem uma conta? <a href="/login">Entre aqui</a></p>
            </div>
        </form>
    </div>
</div>

<script>
    const tipoUsuarioSelect = document.getElementById("tipo_usuario");
    const camposGestor = document.getElementById("campos_gestor");

    function mostrarCamposGestor() {
        if (tipoUsuarioSelect.value === "Redator") {
            camposGestor.style.display = "block";
        } else {
            camposGestor.style.display = "none";
        }
    }

    tipoUsuarioSelect.addEventListener('change', mostrarCamposGestor);
    mostrarCamposGestor(); // Executa ao carregar

    function getUrlParameter(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
    }

    const email = getUrlParameter('email');
    if (email) {
        document.getElementById('emailField').value = email;
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const nome = document.getElementById('nomeField').value;
        const emailVal = document.getElementById('emailField').value;
        const senha = document.getElementById('senhaField').value;
        const tipo = tipoUsuarioSelect.value; // "Cliente" ou "Redator"
        const role = tipo === "Cliente" ? "CLIENTE" : "REDATOR";
        
        // Generate or get agency id
        let empresaId = getUrlParameter('empresaId');
        if (!empresaId) {
            if (role === 'REDATOR') {
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                let code = '';
                for (let i = 0; i < 8; i++) {
                    code += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                empresaId = code;
            } else {
                empresaId = 'UNLINKED';
            }
        }
        
        const errorCard = document.getElementById('errorCard');
        const successCard = document.getElementById('successCard');
        errorCard.style.display = 'none';
        successCard.style.display = 'none';

        try {
            const response = await fetch('/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nome,
                    email: emailVal,
                    senha,
                    role,
                    empresaId,
                    avatar: "icon_padrao.png"
                })
            });

            if (response.status === 204 || response.ok) {
                successCard.style.display = 'block';
                setTimeout(() => {
                    window.location.href = '/login';
                }, 2000);
            } else {
                let errorMsg = 'Erro ao realizar cadastro.';
                try {
                    const result = await response.json();
                    errorMsg = result.message || result.error || errorMsg;
                } catch(err) {
                    const txt = await response.text();
                    if(txt) errorMsg = txt;
                }
                errorCard.textContent = errorMsg;
                errorCard.style.display = 'block';
            }
        } catch (err) {
            errorCard.textContent = 'Erro ao se conectar ao servidor.';
            errorCard.style.display = 'block';
        }
    });
</script>
</body>

</html>
