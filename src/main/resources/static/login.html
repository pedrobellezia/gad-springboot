<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="icon" type="image/png" sizes="16x16" href="/static/img/assets/fav_icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/login_cadastro.css">
</head>
<body>
    <div class="container">
        <div class="left">
            <div class="green-bar"></div>
            <div class="left-content">
                <h1>Bem-vindo de volta</h1>
                <p>Acesse sua conta e continue sua jornada conosco.</p>
            </div>
        </div>
        <div class="right">
            <form id="loginForm">
                <h2>👋 Seja bem-vindo de volta,<br>Faça login para continuar.</h2>
                <p class="sub">Insira seus dados e acesse a plataforma GAD.</p>
                <div id="errorCard" class="error-card" style="display: none;"></div>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Digite seu email" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

                <div class="form-link" style="text-align: right; margin-top: 5px; margin-bottom: 15px;">
                    <a href="/recuperar_senha">Esqueceu sua senha?</a>
                </div>

                <button type="submit">Entrar</button>

                <div class="link">
                    <p>Não tem uma conta? <a href="/register">Crie aqui</a></p>
                </div>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const errorCard = document.getElementById('errorCard');
            errorCard.style.display = 'none';

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });

                if (response.ok) {
                    const token = await response.text();
                    localStorage.setItem('token', token);

                    // Fetch user details to get role and redirect
                    const userResponse = await fetch('/me', {
                        headers: { 'Authorization': 'Bearer ' + token }
                    });

                    if (userResponse.ok) {
                        const user = await userResponse.json();
                        localStorage.setItem('user', JSON.stringify(user));
                        if (user.role === 'CLIENTE') {
                            window.location.href = '/painel_cliente';
                        } else if (user.role === 'REDATOR') {
                            window.location.href = '/painel_redator';
                        } else {
                            errorCard.textContent = 'Acesso não autorizado para esta role.';
                            errorCard.style.display = 'block';
                        }
                    } else {
                        errorCard.textContent = 'Erro ao carregar dados do usuário.';
                        errorCard.style.display = 'block';
                    }
                } else {
                    errorCard.textContent = 'Email ou senha inválidos.';
                    errorCard.style.display = 'block';
                }
            } catch (err) {
                errorCard.textContent = 'Erro ao se conectar ao servidor.';
                errorCard.style.display = 'block';
            }
        });
    </script>
</body>
</html>
